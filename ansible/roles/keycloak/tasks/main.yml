# ansible/roles/keycloak/tasks/main.yml
- name: Create Keycloak directory
  file: path=/opt/box/keycloak state=directory

- name: Template realm export
  template:
    src: realm-box.json.j2
    dest: /opt/box/keycloak/realm-box.json

- name: Deploy Keycloak container
  community.docker.docker_container:
    name: keycloak
    image: "quay.io/keycloak/keycloak:{{ keycloak_version }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "8080:8080"
    env:
      KEYCLOAK_ADMIN:          "{{ keycloak_admin_user }}"
      KEYCLOAK_ADMIN_PASSWORD: "{{ keycloak_admin_password }}"
      KC_HTTP_ENABLED:         "true"
      KC_HOSTNAME:             "{{ box_ip }}"
      KC_HOSTNAME_STRICT:      "false"
    command: ["start-dev", "--import-realm"]
    volumes:
      - "/opt/box/keycloak/realm-box.json:/opt/keycloak/data/import/realm-box.json"

- name: Wait for Keycloak to be ready
  uri:
    url: "http://localhost:8080/realms/master"
    status_code: 200
  register: result
  until: result.status == 200
  retries: 30
  delay: 10

- name: Ensure LOTR users exist and passwords are up to date
  shell: |
    set -euo pipefail

    docker exec keycloak /opt/keycloak/bin/kcadm.sh config credentials \
      --server http://localhost:8080 \
      --realm master \
      --user "{{ keycloak_admin_user }}" \
      --password "{{ keycloak_admin_password }}" >/dev/null

    while IFS=$'\t' read -r username password; do
      existing="$(docker exec keycloak /opt/keycloak/bin/kcadm.sh get users -r "{{ keycloak_realm }}" -q "username=${username}" -q exact=true)"

      if ! grep -q '"username" : "'"${username}"'"' <<< "${existing}"; then
        docker exec keycloak /opt/keycloak/bin/kcadm.sh create users -r "{{ keycloak_realm }}" \
          -s "username=${username}" \
          -s "email=${username}@box.local" \
          -s "enabled=true" \
          -s "emailVerified=true" \
          -s "firstName=LOTR" \
          -s "lastName=Player" >/dev/null
      fi

      docker exec keycloak /opt/keycloak/bin/kcadm.sh set-password -r "{{ keycloak_realm }}" \
        --username "${username}" \
        --new-password "${password}" \
        --temporary=false >/dev/null
    done < <(printf '%s' '{{ keycloak_lotr_users | to_json }}' | jq -r '.[] | [.username, .password] | @tsv')
  args:
    executable: /bin/bash
  no_log: true
  changed_when: true

- name: Get Keycloak admin access token
  uri:
    url: "http://localhost:8080/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ keycloak_admin_user }}"
      password: "{{ keycloak_admin_password }}"
    status_code: 200
  register: keycloak_admin_login
  no_log: true

- name: Get Keycloak realm configuration
  uri:
    url: "http://localhost:8080/admin/realms/{{ keycloak_realm }}"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_admin_login.json.access_token }}"
    status_code: 200
  register: keycloak_realm_config

- name: Deploy MailHog (fake SMTP)
  community.docker.docker_container:
    name: mailhog
    image: mailhog/mailhog
    state: started
    restart_policy: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

- name: Configure Keycloak SMTP to use MailHog
  uri:
    url: "http://localhost:8080/admin/realms/{{ keycloak_realm }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ keycloak_admin_login.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ keycloak_realm_config.json | combine({'smtpServer': {
      'host': '10.0.1.4',
      'port': '1025',
      'from': 'keycloak@box.local',
      'ssl': 'false',
      'starttls': 'false',
      'auth': 'false'
    }}) }}"
    status_code: 204