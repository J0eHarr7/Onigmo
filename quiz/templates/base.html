<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}One Quiz To Rule Them All{% endblock %}</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:    #c9a84c;
    --gold-light: #e8c97a;
    --dark:    #0d0d0d;
    --surface: #141414;
    --card:    #1a1a1a;
    --border:  #2a2a2a;
    --text:    #d4c9a8;
    --muted:   #7a7060;
    --red:     #8b1a1a;
    --green:   #1a5c2a;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Lora', serif;
    min-height: 100vh;
  }
  h1,h2,h3,h4,.font-lotr { font-family: 'Cinzel', serif; }

  /* ── Navbar ── */
  .navbar {
    background: var(--surface) !important;
    border-bottom: 1px solid var(--gold);
  }
  .navbar-brand { color: var(--gold) !important; font-family:'Cinzel',serif; font-size:1.1rem; }
  .nav-link { color: var(--muted) !important; font-size:.85rem; }
  .nav-link:hover { color: var(--gold) !important; }

  /* ── Cards ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .card-header {
    background: rgba(201,168,76,.08);
    border-bottom: 1px solid var(--border);
    font-family: 'Cinzel', serif;
    color: var(--gold);
    letter-spacing: .05em;
  }

  /* ── Buttons ── */
  .btn-gold {
    background: var(--gold);
    color: #000;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    letter-spacing: .05em;
    border: none;
    transition: background .2s;
  }
  .btn-gold:hover { background: var(--gold-light); color:#000; }
  .btn-outline-gold {
    border: 1px solid var(--gold);
    color: var(--gold);
    background: transparent;
    font-family:'Cinzel',serif;
  }
  .btn-outline-gold:hover { background: var(--gold); color:#000; }

  /* ── Form ── */
  .form-control, .form-select {
    background: #111;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .form-control:focus, .form-select:focus {
    background: #111;
    border-color: var(--gold);
    color: var(--text);
    box-shadow: 0 0 0 2px rgba(201,168,76,.2);
  }
  .form-check-input:checked { background-color: var(--gold); border-color: var(--gold); }
  label { color: var(--muted); font-size:.85rem; letter-spacing:.04em; }

  /* ── Quiz specific ── */
  .question-card {
    border-left: 3px solid var(--gold);
    margin-bottom: 1.5rem;
  }
  .question-num { color: var(--gold); font-family:'Cinzel',serif; font-size:.8rem; }
  .option-label {
    display:block; padding:.6rem 1rem;
    border:1px solid var(--border); border-radius:3px;
    cursor:pointer; transition: all .15s;
    color: var(--text);
  }
  .option-label:hover { border-color: var(--gold); background: rgba(201,168,76,.05); }
  input[type=radio]:checked + .option-label {
    border-color: var(--gold);
    background: rgba(201,168,76,.12);
    color: var(--gold-light);
  }

  /* ── Result ── */
  .correct-answer { background: rgba(26,92,42,.3); border-left:3px solid #2d8a4e; padding:.4rem .8rem; border-radius:2px; }
  .wrong-answer   { background: rgba(139,26,26,.3); border-left:3px solid #c0392b; padding:.4rem .8rem; border-radius:2px; }

  /* ── Credential box ── */
  .cred-box {
    background: rgba(201,168,76,.05);
    border: 1px solid var(--gold);
    border-radius:4px;
    padding:1.5rem;
    font-family:'Lora',serif;
  }
  .cred-value {
    background:#111; border:1px solid var(--border);
    padding:.4rem .8rem; border-radius:3px;
    font-family:monospace; color: var(--gold-light);
    word-break:break-all;
  }

  /* ── Leaderboard ── */
  .rank-1 { color: #ffd700; }
  .rank-2 { color: #c0c0c0; }
  .rank-3 { color: #cd7f32; }
  .table { color: var(--text); }
  .table td, .table th { border-color: var(--border); }
  .table thead th { color: var(--gold); font-family:'Cinzel',serif; font-size:.8rem; letter-spacing:.06em; }
  tbody tr:hover { background: rgba(201,168,76,.04); }

  /* ── Score ring ── */
  .score-circle {
    width:120px; height:120px; border-radius:50%;
    border:3px solid var(--gold);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:'Cinzel',serif; margin:0 auto;
  }
  .score-num { font-size:2.2rem; color:var(--gold); line-height:1; }
  .score-denom { font-size:.75rem; color:var(--muted); }

  /* ── Timer ── */
  #timer { font-family:'Cinzel',serif; color:var(--gold); font-size:1.1rem; }
  #timer.warning { color:#e74c3c; }

  /* ── Footer ── */
  .footer-quote { color:var(--muted); font-style:italic; font-size:.8rem; text-align:center; padding:1.5rem 0 .5rem; }

  /* ── Admin table ── */
  .table-sm td, .table-sm th { font-size:.8rem; }
  .badge-done { background:rgba(26,92,42,.5); color:#2ecc71; border:1px solid #2d8a4e; }
  .badge-pend { background:rgba(100,80,0,.3); color:#f39c12; border:1px solid #876000; }
  code { color:var(--gold-light); }
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/">⚔ One Quiz To Rule Them All</a>
    <div class="d-flex gap-3 align-items-center">
      <a class="nav-link" href="/admin">Admin</a>
      {% if session.get('team_id') %}
      <a class="nav-link" href="/logout">Logout</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container py-4">
  {% block content %}{% endblock %}
</div>

<div class="footer-quote">"Not all those who wander are lost." — J.R.R. Tolkien</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
